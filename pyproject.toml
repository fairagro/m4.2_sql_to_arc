[project]
name = "m4-2-sql-to-arc"
dynamic = ["version"]
description = "The FAIRagro SQL-to-ARC client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sql_to_arc",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pylint>=4.0.6",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.1.0",
  "pytest-cov>=7.0.0",
  "pytest-env>=1.7.0",
  "pytest-mock>=3.10.0",
  "mypy>=2.3.0",
  "bandit>=1.7.0",
  "ruff>=0.15.22",
  "pre-commit>=4.6.0",
  "ggshield>=1.52.2",
  "respx>=0.20.0",
  "fastapi>=0.139.0",
  "uvicorn>=0.42.0",
]

# ggshield 1.51.0 pins old transitive deps; override until upstream bumps.
[tool.uv]
override-dependencies = [
  "cryptography>=46.0.6",
  "pyjwt>=2.12.0",
  "pyopenssl>=26.0.0",
  "python-dotenv>=1.2.2",
  "requests>=2.33.0",
]

[tool.uv.sources]
sql_to_arc = { workspace = true }

[tool.uv.workspace]
members = [
    "middleware/sql_to_arc",
]

[tool.pytest.ini_options]
# Test discovery
testpaths = ["middleware/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output and behavior
addopts = [
    "-v",                        # Verbose output
    "--strict-markers",          # Treat unregistered markers as errors
    "--tb=short",                # Shorter traceback format
    "--cov=middleware",          # Enable coverage for middleware packages
    "--cov-report=term-missing", # Show missing lines in terminal
    "--cov-report=html",         # Generate HTML coverage report
    "--cov-report=xml",          # Generate XML coverage report (for CI)
    "--cov-fail-under=80",       # Fail if coverage is below 80%
]

# Asyncio mode
asyncio_mode = "auto"

# Custom markers
markers = [
    "asyncio: marks tests as async",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
    "system: marks tests as system tests",
]

[tool.coverage.run]
# Coverage measurement settings
source = ["middleware"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/.pytest_cache/*",
    "*/build/*",
    "*/dist/*",
    "*/*.egg-info/*",
]
branch = true  # Measure branch coverage

[tool.coverage.report]
# Coverage reporting settings
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.hatch.version]
source = "vcs"
# CI docker tags look like `{id}-docker-v1.1.1` or
# `{id}-docker-v1.1.1-introduce-report-lib.4`. The branch suffix after
# X.Y.Z is GitVersion SemVer, not PEP 440 — hatch-vcs rejects it. Capture
# only the numeric triple (same rationale as docker/Dockerfile.sql_to_arc).
tag-pattern = '^(?:\d+-docker-)?(?P<version>[vV]?\d+\.\d+\.\d+)(?:-.*)?$'

[tool.hatch.build.targets.wheel]
include = ["README.md"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
