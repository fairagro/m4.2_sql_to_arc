name: Feature Pull Request

permissions:
  contents: read
  security-events: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - "main"

concurrency:
  group: feature-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      helm: ${{ steps.changes.outputs.helm }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'middleware/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'docker/**'
              - 'docker-bake.hcl'
              - '.github/**'
              - 'scripts/**'
              - '.pre-commit-config.yaml'
              - '.bandit'
              - 'dev_environment/**'
              - 'versions.env'
              # Do NOT put chart paths only here — that forces Docker build/check
              # without a separate Helm lint job.
            helm:
              - 'charts/**'

  code-quality:
    name: Code Quality
    needs: [detect-changes]
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-code-quality.yml@main
    with:
      python_package_root: middleware
      components: '["sql_to_arc"]'
      mypy_path: middleware/sql_to_arc/src
      pylint_source_roots: middleware/sql_to_arc/src
      skip: ${{ needs.detect-changes.outputs.code != 'true' }}
    secrets: inherit

  build:
    name: Build
    needs: [detect-changes]
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-build.yml@main
    with:
      components: '["sql_to_arc"]'
      image_base_name: fairagro-advanced-middleware
      skip: ${{ needs.detect-changes.outputs.code != 'true' }}
    secrets: inherit

  check:
    name: Check
    needs: [detect-changes, build]
    if: always() && needs.detect-changes.result == 'success'
    # Local until Devinfra #74: omit Trivy licence-check (Alpine GPL noise).
    uses: ./.github/workflows/reusable-check-local.yml
    with:
      version: ${{ needs.build.outputs.version }}
      components: '["sql_to_arc"]'
      image_base_name: fairagro-advanced-middleware
      skip: ${{ needs.detect-changes.outputs.code != 'true' || needs.build.result != 'success' }}
    secrets: inherit

  helm-lint:
    name: Helm Lint
    needs: [detect-changes]
    uses: fairagro/m4.2_middleware_devinfra/.github/workflows/reusable-helm-lint.yml@main
    with:
      chart_dir: charts/fairagro-advanced-middleware-sql-to-arc-chart
      skip: ${{ needs.detect-changes.outputs.helm != 'true' }}
    secrets: inherit

  arc-export-fixtures:
    name: ARC export fixtures
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: No code changes — skipping arc-export fixtures
        if: ${{ needs.detect-changes.outputs.code != 'true' }}
        run: echo "No code paths changed. Exiting with success."

      - name: Checkout code
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        uses: actions/checkout@v7

      - name: Install uv
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        uses: astral-sh/setup-uv@v10.3.3

      - name: Sync workspace
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        run: uv sync --dev --all-packages

      - name: Build arc-export PATH wrapper and run system_local suite
        if: ${{ needs.detect-changes.outputs.code == 'true' }}
        run: |
          set -euo pipefail
          # Single SoT: middleware/sql_to_arc/tests/system_local/arc-export-base.digest
          ARC_EXPORT_BASE="$(tr -d '[:space:]' < middleware/sql_to_arc/tests/system_local/arc-export-base.digest)"
          docker pull "${ARC_EXPORT_BASE}"
          printf 'FROM %s\nRUN ln -sf /arc-export /usr/local/bin/arc-export\n' "${ARC_EXPORT_BASE}" \
            | docker build -t fairagro-arc-export-path:ci -f- /tmp
          export FAIRAGRO_ARC_EXPORT_IMAGE=fairagro-arc-export-path:ci
          uv run pytest -m system_local middleware/sql_to_arc/tests/system_local -v --no-cov
