# Pre-commit configuration — PRODUCT-OWNED until Devinfra #63 moves this path off
# the sync allowlist (or splits .global + product). Last-resort local fork of the
# Devinfra skeleton; do not treat as a synced file. Fleet contract:
# https://github.com/fairagro/m4.2_middleware_devinfra/issues/63
# Local deltas: MYPYPATH (stubs + sql_to_arc src), pylint package path, helm YAML
# exclude, markdownlint OpenSpec globs, unit-test pre-push scope, CST Bake target.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: end-of-file-fixer
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: check-yaml
        exclude: |
          (?x)^(
            \.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
            | helmchart/[^/]+/templates/.*\.ya?ml$
          )
      - id: check-added-large-files
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: check-merge-conflict
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: check-toml
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/
      - id: debug-statements
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/

  - repo: local
    hooks:
      - id: ggshield
        name: ggshield secret scan
        entry: uv run ggshield secret scan pre-commit
        language: system
        pass_filenames: false

      - id: ruff
        name: ruff lint
        entry: uv run ruff check --config ruff.toml middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: ruff-fix
        name: ruff lint (autofix)
        entry: uv run ruff check --fix --exit-non-zero-on-fix --config ruff.toml middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --config ruff.toml middleware/
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: mypy
        name: mypy type check
        # Product path overlay via MYPYPATH (hook `env:` unsupported on this pre-commit).
        entry: >-
          bash -c 'export MYPYPATH=stubs:middleware/sql_to_arc/src;
          uv run mypy --config-file mypy.ini middleware/'
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: bandit
        name: bandit security scan
        # -ll: MEDIUM+ only (`.bandit` has no fail-on-severity; same fail bar as CI — see docs/quality.md)
        entry: uv run bandit -r middleware/ -c .bandit -ll
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: pylint
        name: pylint
        entry: uv run pylint --rcfile .pylintrc middleware/sql_to_arc
        language: system
        files: ^middleware/
        pass_filenames: false

      - id: markdownlint
        name: markdownlint-cli2
        entry: >-
          bash -c 'markdownlint-cli2 "**/*.md"
          "!openspec/**"
          "!.cursor/commands/opsx-*.md"
          "!.cursor/skills/openspec-*/**"
          "!.cursor/rules/openspec-*.mdc"
          "!.github/prompts/opsx-*"
          "!.github/skills/openspec-*/**"'
        language: system
        files: \.md$
        pass_filenames: false
        exclude: ^\.agents/skills/(gh|docker|hadolint|uv|scan-secrets)/

      - id: pytest
        name: pytest unit tests
        entry: bash -c "uv run pytest middleware/*/tests/unit/ --override-ini='addopts='"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: container-structure-test
        name: container structure test
        entry: >-
          bash -c 'CST_BAKE_TARGET=sql_to_arc CST_IMAGE_TAG=sql-to-arc:test
          CST_CONFIG=docker/container-structure-tests/sql_to_arc.yaml
          bash scripts/run-container-structure-test.sh'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
