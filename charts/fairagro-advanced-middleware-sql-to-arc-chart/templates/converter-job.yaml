{{- if .Values.converter.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fairagro-advanced-middleware-sql-to-arc-chart.converterJobName" . }}
  labels:
    {{- include "fairagro-advanced-middleware-sql-to-arc-chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: converter
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: {{ .Values.converter.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.converter.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "fairagro-advanced-middleware-sql-to-arc-chart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: converter
    spec:
      {{- include "fairagro-advanced-middleware-sql-to-arc-chart.converterPodSpec" . | nindent 6 }}
{{- end }}
