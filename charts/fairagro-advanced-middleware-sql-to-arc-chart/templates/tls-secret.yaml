{{- if .Values.tls.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fairagro-advanced-middleware-sql-to-arc-chart.tlsSecretName" . }}
  labels:
    {{- include "fairagro-advanced-middleware-sql-to-arc-chart.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  client.crt: |
    {{- required "tls.clientCert is required when tls.enabled is true (set via SOPS .enc.yaml)" .Values.tls.clientCert | nindent 4 }}
  client.key: |
    {{- required "tls.clientKey is required when tls.enabled is true (set via SOPS .enc.yaml)" .Values.tls.clientKey | nindent 4 }}
{{- end }}
