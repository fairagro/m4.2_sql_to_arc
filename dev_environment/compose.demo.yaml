services:
  db-init:
    image: postgres:15
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
    volumes:
      - ./demo.sql:/tmp/demo.sql:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        echo "Recreating rdi database for demo..."
        psql -c "DROP DATABASE IF EXISTS rdi;"
        psql -c "CREATE DATABASE rdi;"
        echo "Importing local demo.sql..."
        PGDATABASE=rdi psql < /tmp/demo.sql
        echo "Demo database initialization complete."

  middleware-api:
    image: python:3.12-slim
    container_name: middleware-api-demo
    environment:
      - LOG_LEVEL=INFO
      - LOCAL_UID=${LOCAL_UID:-1000}
      - LOCAL_GID=${LOCAL_GID:-1000}
    ports:
      - "8000:8000"
    volumes:
      - ./demo_output:/data/arcs
      - ./demo_api_main.py:/app/main.py:ro
    command: 
      - /bin/sh
      - -c
      - |
        set -e
        apt-get update
        apt-get install -y --no-install-recommends curl
        pip install fastapi uvicorn arctrl
        uvicorn main:app --app-dir /app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  sql_to_arc:
    depends_on:
      db-init:
        condition: service_completed_successfully
      middleware-api:
        condition: service_healthy
    volumes:
      - ./config.demo.yaml:/etc/sql_to_arc/config.yaml:ro
    environment:
      SQL_TO_ARC_CONNECTION_STRING: "postgresql+psycopg://postgres:postgres@postgres:5432/rdi"
