log_level: INFO

connection_string: "postgresql+psycopg://postgres:postgres@postgres:5432/rdi"

rdi: edaphobase
rdi_url: https://edaphobase.org
max_concurrent_arc_builds: 12

api_client:
  api_url: "https://middleware.fairagro.net"
  timeout: 600
  client_cert_path: "/etc/sql_to_arc/client.crt"
  client_key_path: "/run/secrets/client.key"
  verify_ssl: true

otel:
  log_console_spans: false
