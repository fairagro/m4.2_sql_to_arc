[project]
name = "sql_to_arc"
dynamic = ["version"]
description = "The FAIRagro advanced middleware SQL-to-ARC converter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "arctrl>=3.1.1",
  "pydantic>=2.12.5",
  "fairagro-middleware-api-client>=10.0.1",
  "fairagro-middleware-shared>=11.1.1.dev34",
  "opentelemetry-api>=1.30.0",
  "aiomysql>=0.2.0",
  "aioodbc>=0.4.1",
  "oracledb>=4.0.2",
  "psycopg[binary]>=3.3.4",
  "sqlalchemy[asyncio]>=2.0.51",
]

[tool.hatch.version]
source = "vcs"
# See root pyproject.toml — strip GitVersion branch suffix from docker tags.
tag-pattern = '^(?:\d+-docker-)?(?P<version>[vV]?\d+\.\d+\.\d+)(?:-.*)?$'
raw-options = { root = "../.." }

[tool.hatch.build.targets.wheel]
packages = ["src/middleware"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
